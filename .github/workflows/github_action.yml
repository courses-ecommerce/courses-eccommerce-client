name: React Github Workflow Action

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Running Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: 16.14.2

      - name: Install package
        run: npm ci

      - name: Build Script
        run: npm run build
